<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boba App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-orange-50 text-gray-800">

    <header class="bg-orange-400 text-white p-6 shadow-md sticky top-0 z-10">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-3xl font-bold tracking-tight">Bubble Bliss</h1>
            <div class="relative cursor-pointer group" onclick="toggleCart()">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white group-hover:text-orange-200 transition" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
                </svg>
                <span id="cart-count" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs font-bold px-2 py-1 rounded-full shadow-sm">0</span>
            </div>
        </div>
    </header>

    <main class="container mx-auto p-6 mt-6 flex flex-col md:flex-row gap-8">

        <!-- Menu Section -->
        <section class="flex-1">
            <h2 class="text-2xl font-semibold mb-6 border-b-2 border-orange-200 pb-2">Our Menu</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6" id="menu-container">
                <!-- Menu items injected by JS -->
            </div>
        </section>

        <!-- Cart Section (Sidebar) -->
        <aside id="cart-sidebar" class="w-full md:w-1/3 bg-white p-6 rounded-xl shadow-lg border border-orange-100 hidden md:block self-start sticky top-28 transition-all duration-300">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h2 class="text-2xl font-semibold">Your Cart</h2>
                <button onclick="toggleCart()" class="md:hidden text-gray-500 hover:text-red-500">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <div id="cart-items" class="space-y-4 max-h-96 overflow-y-auto mb-4 pr-2">
                <p class="text-gray-500 italic text-center py-4">Your cart is empty.</p>
            </div>

            <div class="border-t pt-4">
                <div class="flex justify-between items-center text-lg font-bold mb-4">
                    <span>Total:</span>
                    <span id="cart-total" class="text-orange-500">$0.00</span>
                </div>
                <button onclick="checkout()" id="checkout-btn" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-lg transition opacity-50 cursor-not-allowed" disabled>
                    Checkout
                </button>
            </div>
        </aside>

        <!-- Mobile Cart Overlay -->
        <div id="cart-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-20 hidden md:hidden" onclick="toggleCart()"></div>

    </main>

    <footer class="bg-gray-800 text-gray-400 text-center py-6 mt-12">
        <p>&copy; 2024 Bubble Bliss. All rights reserved.</p>
    </footer>

    <script>
        const bobaMenu = [
            { id: 1, name: "Classic Milk Tea", price: 4.50, description: "Black tea with milk and classic tapioca pearls.", img: "🧋", tags: ["Bestseller"] },
            { id: 2, name: "Taro Slush", price: 5.00, description: "Sweet taro root blended with ice.", img: "🍠", tags: ["Sweet", "Ice"] },
            { id: 3, name: "Matcha Latte", price: 5.50, description: "Premium matcha green tea with fresh milk.", img: "🍵", tags: ["Premium"] },
            { id: 4, name: "Brown Sugar Boba", price: 6.00, description: "Rich brown sugar syrup with fresh milk and warm pearls.", img: "🍯", tags: ["Sweet"] },
            { id: 5, name: "Mango Passionfruit", price: 5.25, description: "Refreshing fruit tea with mango and passionfruit.", img: "🥭", tags: ["Fruity", "Vegan"] },
            { id: 6, name: "Thai Milk Tea", price: 4.75, description: "Authentic Thai tea with condensed milk.", img: "🇹🇭", tags: ["Strong"] }
        ];

        let cart = [];

        function renderMenu() {
            const container = document.getElementById('menu-container');
            container.innerHTML = bobaMenu.map(item => `
                <div class="bg-white rounded-xl shadow-sm hover:shadow-md transition-shadow border border-gray-100 overflow-hidden flex flex-col">
                    <div class="p-6 flex-grow">
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-4xl" role="img" aria-label="${item.name}">${item.img}</span>
                            <span class="font-bold text-lg text-orange-600">$${item.price.toFixed(2)}</span>
                        </div>
                        <h3 class="text-xl font-bold mb-1">${item.name}</h3>
                        <div class="flex flex-wrap gap-1 mb-3">
                            ${item.tags.map(tag => `<span class="bg-orange-100 text-orange-800 text-xs px-2 py-0.5 rounded-full font-semibold">${tag}</span>`).join('')}
                        </div>
                        <p class="text-gray-600 text-sm">${item.description}</p>
                    </div>
                    <div class="p-4 bg-gray-50 border-t border-gray-100">
                        <button onclick="addToCart(${item.id})" class="w-full bg-orange-100 hover:bg-orange-200 text-orange-700 font-semibold py-2 rounded-lg transition flex items-center justify-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                            </svg>
                            Add to Cart
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const item = bobaMenu.find(i => i.id === id);
            const existingItem = cart.find(i => i.id === id);

            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ ...item, quantity: 1 });
            }

            updateCartUI();

            // Show cart briefly on mobile when adding
            if (window.innerWidth < 768) {
                const sidebar = document.getElementById('cart-sidebar');
                if (sidebar.classList.contains('hidden')) {
                    toggleCart();
                    setTimeout(() => toggleCart(), 2000);
                }
            }
        }

        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            updateCartUI();
        }

        function updateQuantity(id, change) {
            const item = cart.find(i => i.id === id);
            if (item) {
                item.quantity += change;
                if (item.quantity <= 0) {
                    removeFromCart(id);
                } else {
                    updateCartUI();
                }
            }
        }

        function updateCartUI() {
            const cartItemsContainer = document.getElementById('cart-items');
            const cartCountElement = document.getElementById('cart-count');
            const cartTotalElement = document.getElementById('cart-total');
            const checkoutBtn = document.getElementById('checkout-btn');

            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            cartCountElement.innerText = totalItems;

            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '<p class="text-gray-500 italic text-center py-4">Your cart is empty.</p>';
                cartTotalElement.innerText = '$0.00';
                checkoutBtn.disabled = true;
                checkoutBtn.classList.add('opacity-50', 'cursor-not-allowed');
                checkoutBtn.classList.remove('hover:bg-orange-600');
                return;
            }

            checkoutBtn.disabled = false;
            checkoutBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            checkoutBtn.classList.add('hover:bg-orange-600');

            cartItemsContainer.innerHTML = cart.map(item => `
                <div class="flex justify-between items-center bg-gray-50 p-3 rounded-lg border border-gray-100">
                    <div class="flex-1">
                        <div class="flex items-center gap-2">
                            <span>${item.img}</span>
                            <h4 class="font-semibold text-sm truncate">${item.name}</h4>
                        </div>
                        <div class="text-orange-600 font-bold text-sm">$${(item.price * item.quantity).toFixed(2)}</div>
                    </div>
                    <div class="flex items-center gap-2 ml-2 bg-white rounded-lg p-1 border">
                        <button onclick="updateQuantity(${item.id}, -1)" class="w-6 h-6 flex items-center justify-center text-gray-500 hover:text-orange-500 hover:bg-orange-50 rounded">-</button>
                        <span class="text-sm font-semibold w-4 text-center">${item.quantity}</span>
                        <button onclick="updateQuantity(${item.id}, 1)" class="w-6 h-6 flex items-center justify-center text-gray-500 hover:text-orange-500 hover:bg-orange-50 rounded">+</button>
                    </div>
                </div>
            `).join('');

            const totalCost = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            cartTotalElement.innerText = `$${totalCost.toFixed(2)}`;
        }

        function toggleCart() {
            const sidebar = document.getElementById('cart-sidebar');
            const overlay = document.getElementById('cart-overlay');

            if (window.innerWidth < 768) { // Mobile behavior
                if (sidebar.classList.contains('hidden')) {
                    sidebar.classList.remove('hidden');
                    sidebar.classList.add('fixed', 'inset-y-0', 'right-0', 'z-30', 'w-80', 'h-full', 'rounded-none');
                    overlay.classList.remove('hidden');
                } else {
                    sidebar.classList.add('hidden');
                    sidebar.classList.remove('fixed', 'inset-y-0', 'right-0', 'z-30', 'w-80', 'h-full', 'rounded-none');
                    overlay.classList.add('hidden');
                }
            } else {
                // On desktop, it's always visible or controlled differently if desired.
                // For this simple layout, we keep it visible, but if user clicks icon, we can scroll to it or highlight it.
                sidebar.classList.add('ring-2', 'ring-orange-400');
                setTimeout(() => sidebar.classList.remove('ring-2', 'ring-orange-400'), 500);
            }
        }

        function checkout() {
            if (cart.length === 0) return;
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            const totalCost = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0).toFixed(2);
            alert(`Thank you for your order!\n\nYou ordered ${totalItems} items for a total of $${totalCost}.\nYour Bubble Bliss is being prepared!`);
            cart = [];
            updateCartUI();
            if (window.innerWidth < 768) {
                toggleCart(); // Close cart on mobile after checkout
            }
        }

        // Initialize
        renderMenu();
        updateCartUI();

        // Handle resize events to reset mobile classes if switching to desktop view
        window.addEventListener('resize', () => {
            const sidebar = document.getElementById('cart-sidebar');
            const overlay = document.getElementById('cart-overlay');
            if (window.innerWidth >= 768) {
                sidebar.classList.remove('hidden', 'fixed', 'inset-y-0', 'right-0', 'z-30', 'w-80', 'h-full', 'rounded-none');
                sidebar.classList.add('hidden', 'md:block'); // reset to original
                overlay.classList.add('hidden');
            } else {
                sidebar.classList.add('hidden'); // default hidden on mobile until toggled
            }
        });

    </script>
</body>
</html>

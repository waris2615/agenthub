<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Intelligence Hub | SwitDeveloper</title>
    
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
                "background": "#000000",
                "surface": "#0A0A0A",
                "primary": "#0071E3",
                "on-surface": "#F5F5F7",
                "outline": "rgba(255, 255, 255, 0.1)",
            },
            borderRadius: { "apple": "24px", "apple-lg": "32px" },
            fontFamily: { "headline": ["Space Grotesk"], "body": ["Inter"], "label": ["Manrope"] }
          },
        },
      }
    </script>

    <style>
        body { background-color: #000000; color: #F5F5F7; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .glass-card { background: rgba(27, 27, 27, 0.8); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .apple-gradient { background: linear-gradient(180deg, #0071E3 0%, #0056AC 100%); }
        .text-gradient { background: linear-gradient(135deg, #b7c4ff 0%, #0052ff 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 20; }
        
        .bar-3d { position: relative; transform-style: preserve-3d; width: 100%; height: 0%; background: #0071E3; transition: height 1.5s cubic-bezier(0.22, 1, 0.36, 1); border-radius: 6px; }
        .animate-growth .bar-3d { height: var(--bar-height); }
        .tilt-card { transform-style: preserve-3d; transition: transform 0.1s ease-out; }
    </style>
</head>
<body class="bg-background min-h-screen pb-32">

<aside class="hidden lg:flex flex-col h-screen fixed left-0 top-0 w-64 z-50 glass-card border-r-0">
    <div class="p-8 flex items-center gap-4">
        <div class="w-10 h-10 rounded-2xl apple-gradient flex items-center justify-center shadow-2xl">
            <span class="material-symbols-outlined text-white text-2xl" style="font-variation-settings: 'FILL' 1;">bolt</span>
        </div>
        <h1 class="text-xl font-bold font-headline tracking-tight">Kinetic</h1>
    </div>
    <nav class="flex-1 mt-10 px-4 space-y-2">
        <a class="flex items-center gap-4 bg-white/10 text-white rounded-2xl py-3 px-4" href="dashboard.html">
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">grid_view</span>
            <span class="font-medium">Overview</span>
        </a>
    </nav>
</aside>

<main class="lg:ml-64 px-6 lg:px-12 pt-6 lg:pt-10 space-y-8">
    
    <header class="flex justify-between items-center w-full max-w-screen-xl mx-auto mb-6">
        <span class="text-xl font-bold font-headline hidden sm:block">Intelligence Hub</span>
        <div class="flex gap-4">
            <div id="userAvatar" class="w-10 h-10 rounded-full apple-gradient flex items-center justify-center font-bold">
                </div>
        </div>
    </header>

    <section class="chart-3d-container">
        <div id="tiltCard" class="tilt-card glass-card rounded-[32px] lg:rounded-[40px] p-8 lg:p-12 flex flex-col justify-between min-h-[300px] lg:min-h-[400px] relative overflow-hidden group">
            <div class="relative z-10">
                <h1 class="text-3xl lg:text-5xl font-headline font-bold text-gradient leading-tight">
                    Kinetic Performance <br>at 98.4% Efficiency
                </h1>
                <p id="welcomeText" class="text-on-surface-variant font-label text-xs uppercase tracking-widest mt-4">Node Active for Loading...</p>
            </div>
            <div class="absolute right-5 bottom-5 opacity-10 pointer-events-none lg:right-10 lg:bottom-10">
                <span class="material-symbols-outlined text-[10rem] lg:text-[15rem]">rocket_launch</span>
            </div>
        </div>
    </section>

    <section id="projectSection" class="glass-card rounded-apple-lg p-6 lg:p-8 border-primary/20 mt-8">
        <h3 class="text-primary font-bold uppercase tracking-widest text-[10px]">Asset Audit & Intelligence</h3>
        <h2 class="text-2xl font-bold font-headline mt-1 mb-8">Project Management</h2>
        
        <div id="projectList" class="grid grid-cols-1 gap-4">
            <p class="text-white/50 text-sm">Fetching live data from servers...</p>
        </div>
    </section>

</main>

<script>
    // --- API CONNECTION LOGIC ---
    // Change this to your actual backend URL where api_dashboard.php is hosted
    const API_URL = 'https://your-backend-server.com/api_dashboard.php';

    async function fetchDashboardData() {
        try {
            // Include credentials to send the PHP session cookie
            const response = await fetch(API_URL, { credentials: 'omit' }); // Set to 'include' if relying on cookies cross-domain
            const data = await response.json();

            if (data.status === "unauthorized") {
                window.location.href = "login.html"; 
                return;
            }

            // 1. Update UI with User Data
            document.getElementById('welcomeText').innerText = `Node Active for ${data.user.username}`;
            document.getElementById('userAvatar').innerText = data.user.initial;

            // 2. Render Projects
            const projectList = document.getElementById('projectList');
            projectList.innerHTML = ''; // Clear loading text

            data.projects.forEach(p => {
                projectList.innerHTML += `
                    <div class="p-5 rounded-2xl bg-white/5 border border-white/10 flex flex-wrap md:flex-nowrap justify-between items-center gap-6 group hover:bg-white/10 transition-all">
                        <div class="flex items-center gap-4">
                            <img src="${p.image_url}" class="w-16 h-12 object-cover rounded-lg border border-white/10">
                            <div>
                                <h4 class="font-bold text-sm">${p.title}</h4>
                                <p class="text-[10px] opacity-50 uppercase font-bold tracking-tight">By ${p.username} • $${p.price}</p>
                            </div>
                        </div>
                        <span class="text-[9px] font-black uppercase px-2 py-1 rounded bg-white/10 text-white">${p.status}</span>
                    </div>
                `;
            });

        } catch (error) {
            console.error("Error fetching data:", error);
            document.getElementById('projectList').innerHTML = `<p class="text-red-500">Failed to connect to Intelligence Hub server.</p>`;
        }
    }

    // Trigger fetch on load
    window.addEventListener('DOMContentLoaded', fetchDashboardData);

    // --- TILT EFFECT ---
    const card = document.getElementById('tiltCard');
    document.addEventListener('mousemove', (e) => {
        if(!card || window.innerWidth < 1024) return;
        const xAxis = (window.innerWidth / 2 - e.pageX) / 45;
        const yAxis = (window.innerHeight / 2 - e.pageY) / 45;
        card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
    });
</script>

</body>
</html>
